# Publishes the dashboard on GitHub Pages: dashboard/app.py runs in the browser (stlite) on demo data.
name: Dashboard demo

on:
  push:
    branches: [main]
    paths: ["dashboard/**", "site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/demo
          cp site/index.html dashboard/app.py dashboard/sources.py _site/
          cp dashboard/demo/* _site/demo/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
