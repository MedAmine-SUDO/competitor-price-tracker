services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
      POSTGRES_DB: pricetracker
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d pricetracker"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  scheduler:
    build: .
    command: scheduler
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tracker:tracker@db:5432/pricetracker
      BROWSER_CHANNEL: ""          # use the Chromium bundled in the image
    volumes:
      - ./exports:/app/exports
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build: .
    command: dashboard
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tracker:tracker@db:5432/pricetracker
    ports:
      - "8501:8501"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
